name: CI

on:
  push:
    branches: ['main', 'dev']
  pull_request:
    branches: ['main']
    types: [opened, synchronize, reopened]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Veryl 0.22.0
        run: |
          curl -fsSL --retry 3 --retry-delay 5 -o "$RUNNER_TEMP/veryl.zip" \
            https://github.com/veryl-lang/veryl/releases/download/v0.22.0/veryl-x86_64-linux.zip
          unzip -q "$RUNNER_TEMP/veryl.zip" -d "$RUNNER_TEMP/veryl"
          chmod +x "$RUNNER_TEMP/veryl/veryl"
          echo "$RUNNER_TEMP/veryl" >> "$GITHUB_PATH"
      - name: Format check
        continue-on-error: true
        run: veryl fmt --check
      - run: veryl check
      - run: veryl build
      - run: veryl test
      - run: veryl doc
      - name: Interpolation benchmark
        if: ${{ hashFiles('tools/analyze_interpolator_benchmark.py') != '' }}
        run: |
          veryl test --ignored -t interpolator_benchmark
          python3 tools/analyze_interpolator_benchmark.py target/interpolator_benchmark.csv --format json
      - name: Fixed-rate ASRC benchmark
        if: ${{ hashFiles('tools/analyze_fixed_rate_asrc.py') != '' }}
        run: |
          veryl test --ignored -t fixed_rate_asrc_benchmark
          python3 tools/analyze_fixed_rate_asrc.py target/fixed_rate_asrc_benchmark.csv

  backend-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Veryl 0.22.0
        run: |
          curl -fsSL --retry 3 --retry-delay 5 -o "$RUNNER_TEMP/veryl.zip" \
            https://github.com/veryl-lang/veryl/releases/download/v0.22.0/veryl-x86_64-linux.zip
          unzip -q "$RUNNER_TEMP/veryl.zip" -d "$RUNNER_TEMP/veryl"
          chmod +x "$RUNNER_TEMP/veryl/veryl"
          echo "$RUNNER_TEMP/veryl" >> "$GITHUB_PATH"
      - run: veryl test --backend-validate
